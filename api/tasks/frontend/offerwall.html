<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offer Wall - Earn Rewards</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            color: #667eea;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-align: center;
        }

        .user-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }

        .balance {
            font-size: 1.5rem;
            font-weight: bold;
            color: #28a745;
        }

        .level {
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
        }

        .filters {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .filter-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-btn {
            padding: 8px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .filter-btn:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            padding: 10px 20px;
            border: 2px solid #e9ecef;
            border-radius: 25px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .search-box:focus {
            outline: none;
            border-color: #667eea;
        }

        .offers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .offer-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .offer-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .offer-card:hover::before {
            left: 100%;
        }

        .offer-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        .offer-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .offer-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .offer-category {
            background: #f8f9fa;
            color: #6c757d;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .offer-description {
            color: #666;
            line-height: 1.6;
            margin-bottom: 15px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .offer-reward {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 15px;
        }

        .reward-amount {
            font-size: 1.8rem;
            font-weight: bold;
            display: block;
        }

        .reward-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .offer-stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 0.9rem;
            color: #666;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .offer-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #6c757d;
        }

        .btn-secondary:hover {
            background: #e9ecef;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.2rem;
        }

        .error {
            background: #dc3545;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
        }

        .page-btn {
            padding: 10px 15px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .page-btn:hover {
            background: #667eea;
            color: white;
        }

        .page-btn.active {
            background: #667eea;
            color: white;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #333;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #999;
        }

        .close-btn:hover {
            color: #333;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .user-info {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }

            .filter-group {
                flex-direction: column;
                width: 100%;
            }

            .search-box {
                width: 100%;
            }

            .offers-grid {
                grid-template-columns: 1fr;
            }

            .offer-actions {
                flex-direction: column;
            }
        }

        .featured-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: linear-gradient(135deg, #ffc107, #ff6b6b);
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .difficulty-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-left: 8px;
        }

        .difficulty-easy { background: #d4edda; color: #155724; }
        .difficulty-medium { background: #fff3cd; color: #856404; }
        .difficulty-hard { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🎯 Offer Wall</h1>
            <div class="user-info">
                <div class="balance">💰 Balance: $<span id="userBalance">0.00</span></div>
                <div class="level">Level <span id="userLevel">1</span></div>
            </div>
        </div>

        <!-- Filters -->
        <div class="filters">
            <div class="filter-group">
                <input type="text" class="search-box" id="searchBox" placeholder="🔍 Search offers...">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="featured">⭐ Featured</button>
                <button class="filter-btn" data-filter="easy">😊 Easy</button>
                <button class="filter-btn" data-filter="medium">😐 Medium</button>
                <button class="filter-btn" data-filter="hard">😰 Hard</button>
            </div>
        </div>

        <!-- Error Message -->
        <div id="errorMessage" class="error" style="display: none;"></div>

        <!-- Loading -->
        <div id="loadingMessage" class="loading" style="display: none;">
            🔄 Loading amazing offers...
        </div>

        <!-- Offers Grid -->
        <div id="offersGrid" class="offers-grid">
            <!-- Offers will be loaded here -->
        </div>

        <!-- Pagination -->
        <div id="pagination" class="pagination">
            <!-- Pagination will be loaded here -->
        </div>
    </div>

    <!-- Task Modal -->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Task Details</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalBody">
                <!-- Task details will be loaded here -->
            </div>
        </div>
    </div>

    <script>
        // Global variables
        let currentPage = 1;
        let currentFilter = 'all';
        let searchQuery = '';
        let isLoading = false;

        // API Configuration
        const API_BASE = '/api/v1';
        const TASKS_ENDPOINT = `${API_BASE}/tasks/`;
        const COMPLETIONS_ENDPOINT = `${API_BASE}/completions/`;

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadUserInfo();
            loadOffers();
            setupEventListeners();
        });

        // Setup event listeners
        function setupEventListeners() {
            // Filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.filter;
                    currentPage = 1;
                    loadOffers();
                });
            });

            // Search box
            document.getElementById('searchBox').addEventListener('input', function(e) {
                searchQuery = e.target.value;
                debounce(loadOffers, 500)();
            });

            // Modal close on outside click
            document.getElementById('taskModal').addEventListener('click', function(e) {
                if (e.target === this) {
                    closeModal();
                }
            });
        }

        // Load user information
        async function loadUserInfo() {
            try {
                const response = await fetch('/api/v1/analytics/dashboard/', {
                    headers: {
                        'Authorization': `Bearer ${getAuthToken()}`
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    const userStats = data.data.user_stats;
                    document.getElementById('userBalance').textContent = userStats.total_earned || '0.00';
                    document.getElementById('userLevel').textContent = userStats.level || '1';
                }
            } catch (error) {
                console.error('Error loading user info:', error);
            }
        }

        // Load offers
        async function loadOffers() {
            if (isLoading) return;
            
            isLoading = true;
            showLoading(true);
            hideError();

            try {
                const params = new URLSearchParams({
                    page: currentPage,
                    page_size: 12,
                    available_only: 'true'
                });

                // Add filters
                if (currentFilter === 'featured') {
                    params.append('featured', 'true');
                }
                
                if (searchQuery) {
                    params.append('search', searchQuery);
                }

                const response = await fetch(`${TASKS_ENDPOINT}?${params}`, {
                    headers: {
                        'Authorization': `Bearer ${getAuthToken()}`
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    renderOffers(data.data || data);
                    renderPagination(data.pagination);
                } else {
                    showError('Failed to load offers. Please try again.');
                }
            } catch (error) {
                console.error('Error loading offers:', error);
                showError('Network error. Please check your connection.');
            } finally {
                isLoading = false;
                showLoading(false);
            }
        }

        // Render offers
        function renderOffers(offers) {
            const grid = document.getElementById('offersGrid');
            
            if (!offers || offers.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: white;">📭 No offers found</div>';
                return;
            }

            grid.innerHTML = offers.map(offer => createOfferCard(offer)).join('');
        }

        // Create offer card HTML
        function createOfferCard(offer) {
            const isFeatured = offer.is_featured;
            const difficulty = getDifficultyLevel(offer);
            const reward = getRewardAmount(offer);
            
            return `
                <div class="offer-card" onclick="showTaskDetails('${offer.task_id}')">
                    ${isFeatured ? '<div class="featured-badge">⭐ FEATURED</div>' : ''}
                    <div class="offer-header">
                        <div>
                            <div class="offer-title">${offer.name}</div>
                            <div class="offer-category">${getCategoryName(offer.category)}</div>
                        </div>
                        <span class="difficulty-badge difficulty-${difficulty}">${difficulty.toUpperCase()}</span>
                    </div>
                    <div class="offer-description">${offer.description || 'Complete this task to earn rewards!'}</div>
                    <div class="offer-reward">
                        <span class="reward-amount">${reward}</span>
                        <span class="reward-label">REWARD</span>
                    </div>
                    <div class="offer-stats">
                        <div class="stat-item">
                            <span>👥</span>
                            <span>${offer.total_completions || 0} completed</span>
                        </div>
                        <div class="stat-item">
                            <span>⏱️</span>
                            <span>${getEstimatedTime(offer)} min</span>
                        </div>
                    </div>
                    <div class="offer-actions">
                        <button class="btn btn-primary" onclick="startTask('${offer.task_id}', event)">
                            🚀 Start Task
                        </button>
                        <button class="btn btn-secondary" onclick="showTaskDetails('${offer.task_id}', event)">
                            📋 Details
                        </button>
                    </div>
                </div>
            `;
        }

        // Get difficulty level
        function getDifficultyLevel(offer) {
            const level = offer.min_user_level || 1;
            if (level <= 2) return 'easy';
            if (level <= 5) return 'medium';
            return 'hard';
        }

        // Get reward amount
        function getRewardAmount(offer) {
            const rewards = offer.rewards || {};
            const points = rewards.points || 0;
            return `$${(points / 100).toFixed(2)}`;
        }

        // Get category name
        function getCategoryName(category) {
            const categories = {
                'daily_retention': 'Daily Tasks',
                'gamified': 'Games',
                'ads_multimedia': 'Videos & Ads',
                'app_social': 'Social Media',
                'web_content': 'Web Content',
                'refer_team': 'Referrals',
                'advanced_api': 'Advanced'
            };
            return categories[category] || category;
        }

        // Get estimated time
        function getEstimatedTime(offer) {
            const constraints = offer.constraints || {};
            return constraints.estimated_time || 5;
        }

        // Start task
        async function startTask(taskId, event) {
            event.stopPropagation();
            
            try {
                const response = await fetch(COMPLETIONS_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${getAuthToken()}`
                    },
                    body: JSON.stringify({
                        task: taskId,
                        status: 'started'
                    })
                });

                if (response.ok) {
                    showSuccess(`Task "${taskId}" started successfully!`);
                    loadUserInfo(); // Refresh balance
                } else {
                    const error = await response.json();
                    showError(error.error || 'Failed to start task');
                }
            } catch (error) {
                console.error('Error starting task:', error);
                showError('Network error. Please try again.');
            }
        }

        // Show task details
        async function showTaskDetails(taskId, event) {
            if (event) event.stopPropagation();
            
            try {
                const response = await fetch(`${TASKS_ENDPOINT}${taskId}/`, {
                    headers: {
                        'Authorization': `Bearer ${getAuthToken()}`
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    const task = data.data;
                    
                    document.getElementById('modalTitle').textContent = task.name;
                    document.getElementById('modalBody').innerHTML = createTaskDetailsHTML(task);
                    document.getElementById('taskModal').style.display = 'flex';
                } else {
                    showError('Failed to load task details');
                }
            } catch (error) {
                console.error('Error loading task details:', error);
                showError('Network error. Please try again.');
            }
        }

        // Create task details HTML
        function createTaskDetailsHTML(task) {
            return `
                <div style="margin-bottom: 20px;">
                    <h3 style="color: #667eea; margin-bottom: 10px;">📋 Task Description</h3>
                    <p style="line-height: 1.6; color: #666;">${task.description || 'Complete this task to earn rewards!'}</p>
                </div>
                
                <div style="margin-bottom: 20px;">
                    <h3 style="color: #667eea; margin-bottom: 10px;">💰 Rewards</h3>
                    <div style="background: #f8f9fa; padding: 15px; border-radius: 10px;">
                        <div style="font-size: 1.2rem; font-weight: bold; color: #28a745;">
                            ${getRewardAmount(task)}
                        </div>
                        <div style="color: #666; margin-top: 5px;">
                            +${getExperiencePoints(task)} XP
                        </div>
                    </div>
                </div>
                
                <div style="margin-bottom: 20px;">
                    <h3 style="color: #667eea; margin-bottom: 10px;">📊 Statistics</h3>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                        <div style="background: #f8f9fa; padding: 10px; border-radius: 8px;">
                            <div style="color: #666; font-size: 0.9rem;">Total Completions</div>
                            <div style="font-weight: bold;">${task.total_completions || 0}</div>
                        </div>
                        <div style="background: #f8f9fa; padding: 10px; border-radius: 8px;">
                            <div style="color: #666; font-size: 0.9rem;">Unique Users</div>
                            <div style="font-weight: bold;">${task.unique_users_completed || 0}</div>
                        </div>
                    </div>
                </div>
                
                <div style="text-align: center; margin-top: 30px;">
                    <button class="btn btn-primary" style="padding: 15px 40px; font-size: 1.1rem;" 
                            onclick="startTask('${task.task_id}')">
                        🚀 Start This Task
                    </button>
                </div>
            `;
        }

        // Get experience points
        function getExperiencePoints(offer) {
            const rewards = offer.rewards || {};
            return rewards.experience || 0;
        }

        // Render pagination
        function renderPagination(pagination) {
            if (!pagination) return;
            
            const paginationDiv = document.getElementById('pagination');
            const {page, total_pages, has_next, has_previous} = pagination;
            
            let html = '';
            
            if (has_previous) {
                html += `<button class="page-btn" onclick="goToPage(${page - 1})">← Previous</button>`;
            }
            
            // Page numbers
            const startPage = Math.max(1, page - 2);
            const endPage = Math.min(total_pages, page + 2);
            
            for (let i = startPage; i <= endPage; i++) {
                html += `<button class="page-btn ${i === page ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
            }
            
            if (has_next) {
                html += `<button class="page-btn" onclick="goToPage(${page + 1})">Next →</button>`;
            }
            
            paginationDiv.innerHTML = html;
        }

        // Go to page
        function goToPage(page) {
            currentPage = page;
            loadOffers();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Close modal
        function closeModal() {
            document.getElementById('taskModal').style.display = 'none';
        }

        // Utility functions
        function getAuthToken() {
            return localStorage.getItem('authToken') || '';
        }

        function showLoading(show) {
            document.getElementById('loadingMessage').style.display = show ? 'block' : 'none';
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => errorDiv.style.display = 'none', 5000);
        }

        function showSuccess(message) {
            // Create success message element
            const successDiv = document.createElement('div');
            successDiv.className = 'error';
            successDiv.style.background = '#28a745';
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            
            document.querySelector('.container').insertBefore(successDiv, document.querySelector('.filters'));
            
            setTimeout(() => successDiv.remove(), 3000);
        }

        function hideError() {
            document.getElementById('errorMessage').style.display = 'none';
        }

        // Debounce function
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }
    </script>
</body>
</html>
