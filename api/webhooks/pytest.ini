[pytest]
# BUG FIX (Session 10): tests/test_missing_coverage.py::ProductionInfrastructureTest
# already checks for this file's existence (alongside requirements.txt and
# tests/conftest.py) as part of its "production configuration files exist"
# sanity check, but it was never actually added.
#
# DJANGO_SETTINGS_MODULE matches the default tests/conftest.py already sets
# via os.environ.setdefault(...) before calling django.setup() itself, so
# this is documentation of that existing convention, not a new requirement.
# A real DJANGO_SETTINGS_MODULE env var (or --ds) at invocation time still
# takes precedence over both, e.g. when this app is exercised from inside
# the outer earning_backend project's own test settings.
DJANGO_SETTINGS_MODULE = tests.settings_test
python_files = tests.py test_*.py *_tests.py
testpaths = tests
