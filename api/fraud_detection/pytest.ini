[pytest]
DJANGO_SETTINGS_MODULE = test_settings
python_files = tests/test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --tb=short
    -v
    --reuse-db
markers =
    unit: Unit tests (fast, no DB)
    integration: Integration tests (requires DB)
    performance: Performance tests (slow)
    slow: Slow tests
