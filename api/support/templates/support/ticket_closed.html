<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;padding:0}
.container{max-width:600px;margin:40px auto;background:#fff;border-radius:8px;overflow:hidden}
.header{background:#6b7280;color:#fff;padding:30px;text-align:center}
.header h1{margin:0}.body{padding:30px}
.btn{display:inline-block;background:#6366f1;color:#fff;padding:12px 24px;border-radius:6px;text-decoration:none;margin:20px 0}
.footer{background:#f9fafb;padding:20px;text-align:center;color:#6b7280;font-size:13px}
</style></head><body>
<div class="container">
  <div class="header"><h1>⛔ Ticket Closed</h1></div>
  <div class="body">
    <p>Hello <strong>{{ username }}</strong>,</p>
    <p>Ticket <strong>#{{ ticket_id }}</strong> has been closed.</p>
    <p>If you need further assistance, please create a new ticket.</p>
    <a href="{{ ticket_url }}" class="btn">Create New Ticket →</a>
  </div>
  <div class="footer">© {{ year }} {{ site_name }}</div>
</div></body></html>
