<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;padding:0}
.container{max-width:600px;margin:40px auto;background:#fff;border-radius:8px;overflow:hidden}
.header{background:#7c3aed;color:#fff;padding:30px;text-align:center}
.header h1{margin:0}.body{padding:30px}
.ticket-box{background:#faf5ff;border-left:4px solid #7c3aed;padding:15px;border-radius:4px;margin:20px 0}
.btn{display:inline-block;background:#7c3aed;color:#fff;padding:12px 24px;border-radius:6px;text-decoration:none;margin:20px 0}
.footer{background:#f9fafb;padding:20px;text-align:center;color:#6b7280;font-size:13px}
</style></head><body>
<div class="container">
  <div class="header"><h1>🔴 Ticket Escalated</h1></div>
  <div class="body">
    <p>Hello <strong>{{ supervisor }}</strong>,</p>
    <p>Ticket <strong>#{{ ticket_id }}</strong> has been escalated and requires your attention.</p>
    <div class="ticket-box">
      <p><strong>Subject:</strong> {{ subject }}</p>
      <p><strong>Priority:</strong> {{ priority }}</p>
      <p><strong>Category:</strong> {{ category }}</p>
      <p><strong>User:</strong> {{ user }}</p>
      <p><strong>Assigned To:</strong> {{ assigned_to }}</p>
    </div>
    <a href="{{ ticket_url }}" class="btn">Review Ticket →</a>
  </div>
  <div class="footer">© {{ year }} {{ site_name }}</div>
</div></body></html>
