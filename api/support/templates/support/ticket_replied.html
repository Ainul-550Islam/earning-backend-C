<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;padding:0}
.container{max-width:600px;margin:40px auto;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.header{background:#10b981;color:#fff;padding:30px;text-align:center}
.header h1{margin:0;font-size:24px}
.body{padding:30px}
.reply-box{background:#f0fdf4;border-left:4px solid #10b981;padding:20px;border-radius:4px;margin:20px 0;white-space:pre-wrap;line-height:1.6}
.btn{display:inline-block;background:#10b981;color:#fff;padding:12px 24px;border-radius:6px;text-decoration:none;margin:20px 0}
.footer{background:#f9fafb;padding:20px;text-align:center;color:#6b7280;font-size:13px}
</style></head><body>
<div class="container">
  <div class="header"><h1>💬 New Reply on Your Ticket</h1></div>
  <div class="body">
    <p>Hello <strong>{{ username }}</strong>,</p>
    <p><strong>{{ reply_from }}</strong> has replied to your ticket <strong>#{{ ticket_id }}</strong>:</p>
    <div class="reply-box">{{ reply }}</div>
    <a href="{{ ticket_url }}" class="btn">View & Reply →</a>
    <p>Please log in to your account to view the full reply and respond.</p>
  </div>
  <div class="footer">© {{ year }} {{ site_name }}</div>
</div></body></html>
