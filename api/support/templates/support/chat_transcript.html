<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;padding:0}
.container{max-width:600px;margin:40px auto;background:#fff;border-radius:8px;overflow:hidden}
.header{background:#0ea5e9;color:#fff;padding:30px;text-align:center}
.header h1{margin:0}.body{padding:30px}
.transcript{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:20px;font-family:monospace;white-space:pre-wrap;font-size:13px;max-height:400px;overflow-y:auto}
.footer{background:#f9fafb;padding:20px;text-align:center;color:#6b7280;font-size:13px}
</style></head><body>
<div class="container">
  <div class="header"><h1>💬 Chat Transcript</h1></div>
  <div class="body">
    <p>Hello <strong>{{ username }}</strong>,</p>
    <p>Here is the transcript of your chat session on {{ started_at }}:</p>
    <div class="transcript">{{ transcript }}</div>
    <p style="color:#6b7280;font-size:13px">Session ID: {{ session_id }} · Duration: {{ started_at }} → {{ ended_at }}</p>
  </div>
  <div class="footer">© {{ year }} {{ site_name }}</div>
</div></body></html>
