<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;padding:0}
.container{max-width:600px;margin:40px auto;background:#fff;border-radius:8px;overflow:hidden}
.header{background:#1e293b;color:#fff;padding:30px;text-align:center}
.header h1{margin:0}.body{padding:30px}
.stats{display:flex;flex-wrap:wrap;gap:15px;margin:20px 0}
.stat{flex:1;min-width:120px;background:#f8fafc;border-radius:8px;padding:15px;text-align:center;border-top:3px solid #6366f1}
.stat .num{font-size:28px;font-weight:bold;color:#1e293b}
.stat .label{color:#6b7280;font-size:13px;margin-top:5px}
.footer{background:#f9fafb;padding:20px;text-align:center;color:#6b7280;font-size:13px}
</style></head><body>
<div class="container">
  <div class="header"><h1>📊 Daily Support Report</h1><p>{{ date }}</p></div>
  <div class="body">
    <div class="stats">
      <div class="stat"><div class="num">{{ created }}</div><div class="label">Created</div></div>
      <div class="stat"><div class="num">{{ resolved }}</div><div class="label">Resolved</div></div>
      <div class="stat"><div class="num">{{ open }}</div><div class="label">Open</div></div>
      <div class="stat"><div class="num" style="color:#f59e0b">{{ csat }}/5</div><div class="label">CSAT</div></div>
      <div class="stat"><div class="num" style="color:{% if sla_rate >= 90 %}#16a34a{% else %}#dc2626{% endif %}">{{ sla_rate }}%</div><div class="label">SLA</div></div>
    </div>
  </div>
  <div class="footer">© {{ year }} {{ site_name }}</div>
</div></body></html>
