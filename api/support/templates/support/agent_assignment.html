<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;padding:0}
.container{max-width:600px;margin:40px auto;background:#fff;border-radius:8px;overflow:hidden}
.header{background:#6366f1;color:#fff;padding:30px;text-align:center}
.header h1{margin:0}.body{padding:30px}
.ticket-box{background:#f8f9ff;border-left:4px solid #6366f1;padding:15px;border-radius:4px;margin:20px 0}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:bold}
.urgent{background:#fef2f2;color:#dc2626}.high{background:#fff7ed;color:#ea580c}
.medium{background:#fffbeb;color:#ca8a04}.low{background:#f0fdf4;color:#16a34a}
.btn{display:inline-block;background:#6366f1;color:#fff;padding:12px 24px;border-radius:6px;text-decoration:none;margin:20px 0}
.footer{background:#f9fafb;padding:20px;text-align:center;color:#6b7280;font-size:13px}
</style></head><body>
<div class="container">
  <div class="header"><h1>🎯 New Ticket Assigned to You</h1></div>
  <div class="body">
    <p>Hello <strong>{{ agent_name }}</strong>,</p>
    <p>A new ticket has been assigned to you:</p>
    <div class="ticket-box">
      <p><strong>Ticket ID:</strong> #{{ ticket_id }}</p>
      <p><strong>Priority:</strong> <span class="badge {{ priority|lower }}">{{ priority }}</span></p>
      <p><strong>Category:</strong> {{ category }}</p>
      <p><strong>User:</strong> {{ user }}</p>
      <p><strong>Subject:</strong> {{ subject }}</p>
      <p><strong>Description:</strong> {{ description }}</p>
    </div>
    <a href="{{ ticket_url }}" class="btn">Open Ticket →</a>
  </div>
  <div class="footer">© {{ year }} {{ site_name }}</div>
</div></body></html>
