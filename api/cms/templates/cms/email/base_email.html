<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block subject %}Notification{% endblock %}</title>
<style>
  body{margin:0;padding:0;background:#f4f4f4;font-family:Arial,sans-serif}
  .wrapper{max-width:600px;margin:0 auto;background:#fff;border-radius:8px;overflow:hidden}
  .header{background:#1a73e8;padding:24px 32px;text-align:center}
  .header img{height:40px}
  .header h1{color:#fff;margin:8px 0 0;font-size:20px}
  .body{padding:32px}
  .body p{color:#444;line-height:1.6;margin:0 0 16px}
  .btn{display:inline-block;background:#1a73e8;color:#fff;text-decoration:none;padding:12px 28px;border-radius:6px;font-weight:bold;margin:8px 0}
  .highlight{background:#f0f7ff;border-left:4px solid #1a73e8;padding:16px;border-radius:4px;margin:16px 0}
  .highlight .amount{font-size:28px;font-weight:bold;color:#1a73e8}
  .footer{background:#f8f8f8;padding:20px 32px;text-align:center;font-size:12px;color:#888}
  .footer a{color:#1a73e8;text-decoration:none}
</style>
</head>
<body>
<div class="wrapper">
  <div class="header">
    <h1>{{ site_name }}</h1>
  </div>
  <div class="body">
    {% block content %}{% endblock %}
  </div>
  <div class="footer">
    <p>© {{ year }} {{ site_name }} · <a href="{{ unsubscribe_url }}">Unsubscribe</a> · <a href="{{ site_url }}/privacy/">Privacy</a></p>
    <p>{{ site_url }}</p>
  </div>
</div>
</body>
</html>
