{% extends "offer_routing/_base.html" %}
{% block title %}{% if object %}Edit{% else %}Create{% endif %} A/B Test{% endblock %}
{% block content %}
<h1>{% if object %}Edit{% else %}Create{% endif %} A/B Test</h1>
<div class="card"><div class="card-body">
<form method="post">
    {% csrf_token %}{{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'offer_routing:ab-test-list' %}" class="btn btn-secondary">Cancel</a>
</form>
</div></div>
{% endblock %}
